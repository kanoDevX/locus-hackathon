services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "UstazAI_Docker_Pwd_2026!"
    ports:
      - "1433:1433"
    volumes:
      - ustazai-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=UstazAI;User Id=sa;Password=UstazAI_Docker_Pwd_2026!;TrustServerCertificate=True"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in your environment or a .env file}"
      Gemini__ApiKey: "${GEMINI_API_KEY:-}"

volumes:
  ustazai-sql-data:
